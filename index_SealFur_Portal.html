<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seal &amp; Fur Programs — Government of Nunavut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F7FAF8; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1A2820; }
    input, select, textarea, button { font-family: inherit; }
    input[type="file"] { width: 100%; padding: 10px 12px; border: 1.5px dashed #D4E6DF; border-radius: 8px; font-size: 13px; color: #6B8A7E; background: #EBF5F1; cursor: pointer; }
    input[type="file"]:hover { border-color: #2A7D6B; }
    input[type="radio"] { accent-color: #2A7D6B; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef } = React;

    // =========================================================
    // CONFIGURATION — replace with your Supabase project values
    // Supabase Dashboard → Settings → API
    // =========================================================
    const SUPABASE_URL      = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    // =========================================================

    const IS_DEMO = SUPABASE_URL === "YOUR_SUPABASE_URL";

    // ── Supabase helpers ──────────────────────────────────────
    async function sbFetch(path, opts = {}, token = null) {
      const res = await fetch(`${SUPABASE_URL}${path}`, {
        ...opts,
        headers: { "Content-Type":"application/json", "apikey":SUPABASE_ANON_KEY, "Authorization":`Bearer ${token||SUPABASE_ANON_KEY}`, ...opts.headers },
      });
      if (!res.ok) { const e = await res.json().catch(()=>({message:res.statusText})); throw new Error(e.message||e.error_description||"Request failed"); }
      return res.status === 204 ? null : res.json();
    }
    const submitApplication = (data) => sbFetch("/rest/v1/seal_fur_applications", { method:"POST", body:JSON.stringify(data), headers:{"Prefer":"return=minimal"} });
    const lookupStatus = async (code) => { const r = await sbFetch("/rest/v1/rpc/get_seal_fur_status",{method:"POST",body:JSON.stringify({lookup_code:code})}); return Array.isArray(r)?r[0]:null; };
    const adminSignIn = async (email,pw) => { const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},body:JSON.stringify({email,password:pw})}); if(!res.ok){const e=await res.json();throw new Error(e.error_description||"Invalid credentials");} return res.json(); };
    const adminSignOut = (token) => fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${token}`}}).catch(()=>{});
    const fetchAllApps = (token) => sbFetch("/rest/v1/seal_fur_applications?order=created_at.desc",{method:"GET"},token);
    const updateApp = (id,patch,token) => sbFetch(`/rest/v1/seal_fur_applications?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",body:JSON.stringify(patch),headers:{"Prefer":"return=minimal"}},token);

    // ── Demo data ─────────────────────────────────────────────
    const DEMO_APPS = [
      { id:"SFP-2026-0001", code:"IQA3-SKLM", program:"sealskin_purchase", is_inuit_beneficiary:"yes", org:"Kinngait Seamstress Co-op", community:"Cape Dorset (Kinngait)", contact:"Ningeokuluk Teevee", email:"n.teevee@kinngaitcoop.ca", phone:"867-897-8953", address:"Box 120, Cape Dorset, NU X0A 0G0", has_business_licence:"yes", business_licence_num:"NU-20223871", title:"Dressed Sealskin Purchase — Spring Collection", description:"Order of 25 dressed ringed sealskins (mixed sizes) for spring amauti and kamik production. Our co-op employs 12 seamstresses producing traditional garments for local sale and southern markets.", sealskin_quantity:25, sealskin_sizes:"Mixed — 8 small, 10 medium, 7 large", sealskin_type:"Dressed (natural)", amount:2500, budget_items:[], uploaded_docs:["Kinngait_Coop_Business_Licence_2026.pdf","Spring_Order_Letter.pdf"], stage:"assessment", notes:"Order confirmed pending stock availability check with DoE.", submitted:"2026-01-15", messages:[{id:"msg-001",type:"doc_request",from:"admin",sender:"J. Quassa",text:"Your business licence on file expired in December 2025. Please provide a current copy of your Nunavut Business Licence to proceed with invoicing. We also need confirmation of your preferred shipping address for this order.",documents:["Current Nunavut Business Licence (renewed)","Shipping address confirmation"],status:"pending",timestamp:"2026-02-05T10:30:00"},{id:"msg-002",type:"message",from:"admin",sender:"J. Quassa",text:"We have confirmed stock availability for your requested sizes. 8 small, 10 medium, and 7 large dressed natural sealskins are reserved pending your documentation.",documents:[],status:"read",timestamp:"2026-02-08T14:15:00"}] },
      { id:"SFP-2026-0002", code:"RAN5-FGRT", program:"contribution", is_inuit_beneficiary:"yes", org:"Kivalliq Arctic Foods", community:"Rankin Inlet (Kangiqliniq)", contact:"Peter Taptuna", email:"p.taptuna@kivalliqfoods.ca", phone:"867-645-3100", address:"Box 88, Rankin Inlet, NU X0C 0G0", has_business_licence:"yes", business_licence_num:"NU-20198206", title:"Seal Oil Value-Added Processing Pilot", description:"Pilot project to develop food-grade seal oil capsules and bottled seal oil for retail. Includes equipment purchase, product testing, CFIA compliance, label design, and initial market outreach to health food distributors in southern Canada.", sealskin_quantity:0, sealskin_sizes:"", sealskin_type:"", amount:85000, budget_items:[{description:"Seal oil extraction & filtration equipment",amount:42000},{description:"CFIA compliance testing & certification",amount:18000},{description:"Packaging, label design & initial production run",amount:15000},{description:"Market research & distributor outreach travel",amount:10000}], uploaded_docs:["Seal_Oil_Pilot_Proposal_v2.pdf","Equipment_Quote_ArcticProcessing.pdf","Kivalliq_Arctic_Foods_Insurance.pdf"], stage:"committee", notes:"Strong proposal. Budget reviewed — awaiting committee quorum March 20.", submitted:"2026-02-03", messages:[{id:"msg-003",type:"question",from:"admin",sender:"M. Aulaqiaq",text:"Can you confirm whether the CFIA compliance testing cost of $18,000 includes both initial facility inspection and product testing, or only product testing? If the facility inspection is separate, please provide a revised budget line.",documents:[],status:"pending",timestamp:"2026-03-01T09:45:00"},{id:"msg-004",type:"doc_request",from:"admin",sender:"M. Aulaqiaq",text:"Please provide the following supporting documents to complete the technical assessment of your contribution application.",documents:["Supplier quote for seal oil extraction equipment","CFIA pre-compliance checklist or assessment","Proof of business insurance"],status:"pending",timestamp:"2026-03-05T11:20:00"}] },
      { id:"SFP-2026-0003", code:"PAN8-DKWN", program:"grant", is_inuit_beneficiary:"yes", org:"Pangnirtung Fur Harvesters Association", community:"Pangnirtung (Panniqtuuq)", contact:"Levi Evic", email:"l.evic@pangharvest.ca", phone:"867-473-8900", address:"General Delivery, Pangnirtung, NU X0A 0R0", has_business_licence:"no", business_licence_num:"", title:"Youth Sealskin Preparation Workshop Series", description:"Four-weekend workshop series teaching 15 youth aged 14–25 traditional sealskin stretching, scraping, and preparation techniques. Elders from the community will lead instruction. Materials and honoraria included.", sealskin_quantity:0, sealskin_sizes:"", sealskin_type:"", amount:8500, budget_items:[{description:"Elder instructor honoraria (4 weekends × 2 elders)",amount:4000},{description:"Raw sealskins for practice (20)",amount:2500},{description:"Workshop supplies (scrapers, frames, stretching boards)",amount:1200},{description:"Participant meals & refreshments",amount:800}], uploaded_docs:["Youth_Workshop_Proposal.pdf","Pangnirtung_HTO_Letter_of_Support.pdf"], stage:"agreement", notes:"Approved Feb 18. Contribution agreement drafted — awaiting org signature.", submitted:"2026-01-22", messages:[{id:"msg-006",type:"send_document",from:"admin",sender:"J. Quassa",text:"Please find the attached contribution agreement for the Youth Sealskin Preparation Workshop Series. Review the terms and conditions carefully, sign both copies, and return one signed copy to our office by email or mail. The project may proceed once the signed agreement is received.",attachments:[{name:"SFP_Contribution_Agreement_PAN8-DKWN.pdf",size:245000,type:"application/pdf"},{name:"SFP_Terms_and_Conditions_2026.pdf",size:128000,type:"application/pdf"}],documents:[],status:"read",timestamp:"2026-02-20T13:45:00"},{id:"msg-007",type:"doc_request",from:"admin",sender:"J. Quassa",text:"Before we can release the first instalment, please provide the following:",documents:["Signed contribution agreement (both copies)","Proof of workshop venue booking","List of confirmed Elder instructors"],attachments:[],status:"pending",timestamp:"2026-02-25T09:30:00"}] },
      { id:"SFP-2026-0004", code:"CAM2-HJNP", program:"donation", is_inuit_beneficiary:"no", org:"Canadian Museum of Nature", community:"Cambridge Bay", contact:"Dr. Sarah Wilkinson", email:"s.wilkinson@nature.ca", phone:"613-364-4021", address:"240 McLeod St, Ottawa, ON K2P 2R1", has_business_licence:"no", business_licence_num:"", title:"Sealskin Donation — Arctic Cultures Exhibition", description:"Request for donation of 6 dressed sealskins for a permanent Arctic cultures and livelihoods exhibition opening fall 2026. The exhibit will educate over 200,000 annual visitors about Inuit sealing traditions, sustainable harvesting, and the cultural importance of seal products.", sealskin_quantity:6, sealskin_sizes:"3 medium, 3 large", sealskin_type:"Dressed (natural and dyed)", amount:0, budget_items:[], uploaded_docs:["Arctic_Cultures_Exhibition_Prospectus.pdf"], stage:"eligibility", notes:"Reviewing proposal alignment with sector priorities.", submitted:"2026-02-28", messages:[{id:"msg-005",type:"doc_request",from:"admin",sender:"J. Quassa",text:"Thank you for your interest in Nunavut sealskins for your exhibition. To evaluate your donation request, we need additional documentation about the exhibition's scope and how it will benefit the sealing industry.",documents:["Detailed exhibition plan or prospectus","Letter of support from a Nunavut community or organization","Proof of not-for-profit status"],status:"pending",timestamp:"2026-03-10T16:00:00"}] },
    ];

    // ── Constants ─────────────────────────────────────────────
    const PROGRAMS = [
      {key:"sealskin_purchase",label:"Dressed Sealskins for Nunavummiut",short:"Sealskin Purchase",schedule:"A",icon:"🦭",desc:"Purchase Nunavut-harvested dressed sealskins at cost price.",maxAmount:"$100,000/yr"},
      {key:"donation",label:"Sealskin Donations Grants-In-Kind",short:"Sealskin Donation",schedule:"B",icon:"🎁",desc:"Request donated sealskin pelts for not-for-profit or special events.",maxAmount:"5% of annual stock"},
      {key:"contribution",label:"Seal and Fur Contributions",short:"Contribution",schedule:"C",icon:"📋",desc:"Financial assistance for seal & fur promotion, research, or development projects.",maxAmount:"Up to $150,000/yr"},
      {key:"grant",label:"Seal and Fur Grant",short:"Grant",schedule:"D",icon:"💰",desc:"Grants up to $10,000 for seal & fur promotion, advocacy, or research projects.",maxAmount:"Up to $10,000"},
    ];
    const STAGES = [
      {key:"received",label:"Application Received",short:"Received"},
      {key:"eligibility",label:"Eligibility Review",short:"Eligibility"},
      {key:"assessment",label:"Assessment",short:"Assessment"},
      {key:"committee",label:"Approval Committee",short:"Committee"},
      {key:"decision",label:"Decision",short:"Decision"},
      {key:"agreement",label:"Agreement / Order",short:"Agreement"},
      {key:"disbursed",label:"Disbursed / Fulfilled",short:"Complete"},
    ];
    const COMMUNITIES = ["Arviat","Baker Lake","Cambridge Bay","Cape Dorset (Kinngait)","Chesterfield Inlet","Clyde River (Kangiqtugaapik)","Coral Harbour (Salliq)","Gjoa Haven (Uqsuqtuuq)","Grise Fiord (Aujuittuq)","Hall Beach (Sanirajak)","Igloolik (Iglulik)","Iqaluit","Kimmirut","Kugaaruk","Kugluktuk","Naujaat (Repulse Bay)","Pangnirtung (Panniqtuuq)","Pond Inlet (Mittimatalik)","Qikiqtarjuaq","Rankin Inlet (Kangiqliniq)","Resolute (Qausuittuq)","Sanikiluaq","Taloyoak (Spence Bay)","Whale Cove (Tikirarjuaq)","Outside Nunavut"];
    const SEALSKIN_SIZES = ["Small","Medium","Large","Extra Large","Mixed Sizes"];
    const SEALSKIN_TYPES = ["Dressed (natural)","Dressed (dyed — black)","Dressed (dyed — other colour)","Mixed"];
    const FUR_SPECIES = ["Squirrel","Beaver","Fox","Wolf","Coyote","Ermine","Weasel","Mink","Wolverine","Otter","Marten","Fisher","Lynx","Muskrat","Bear"];
    const STAGE_COLORS = {received:"#2980B9",eligibility:"#2980B9",assessment:"#C4882A",committee:"#C4882A",decision:"#2A7D6B",agreement:"#3BAE8E",disbursed:"#3BAE8E"};
    const C = {ink:"#1A2820",forest:"#1D4D35",teal:"#2A7D6B",mint:"#3BAE8E",ice:"#EBF5F1",snow:"#F7FAF8",gold:"#C4882A",amber:"#F5A623",line:"#D4E6DF",muted:"#6B8A7E",danger:"#C0392B",sky:"#2980B9"};

    // ── Shared UI ─────────────────────────────────────────────
    const Lbl = ({c}) => <div style={{fontSize:11,fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:C.muted,marginBottom:5}}>{c}</div>;
    const Inp = ({style,...p}) => <input style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.line}`,borderRadius:8,fontSize:14,color:C.ink,background:"#fff",outline:"none",boxSizing:"border-box",...style}} onFocus={e=>e.target.style.borderColor=C.teal} onBlur={e=>e.target.style.borderColor=C.line} {...p}/>;
    const Sel = ({children,style,...p}) => <select style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.line}`,borderRadius:8,fontSize:14,color:C.ink,background:"#fff",outline:"none",boxSizing:"border-box",appearance:"none",...style}} onFocus={e=>e.target.style.borderColor=C.teal} onBlur={e=>e.target.style.borderColor=C.line} {...p}>{children}</select>;
    const Txta = ({style,...p}) => <textarea style={{width:"100%",padding:"10px 12px",border:`1.5px solid ${C.line}`,borderRadius:8,fontSize:14,color:C.ink,background:"#fff",outline:"none",boxSizing:"border-box",resize:"vertical",minHeight:90,...style}} onFocus={e=>e.target.style.borderColor=C.teal} onBlur={e=>e.target.style.borderColor=C.line} {...p}/>;
    const Btn = ({variant="primary",style,loading,children,...p}) => { const vs={primary:{background:C.forest,color:"#fff",border:"none"},ghost:{background:"transparent",color:C.muted,border:`1.5px solid ${C.line}`}}; return <button disabled={loading} style={{padding:"10px 22px",borderRadius:8,fontSize:14,fontWeight:700,cursor:loading?"wait":"pointer",opacity:loading?0.7:1,...vs[variant],...style}} onMouseEnter={e=>{if(!loading)e.currentTarget.style.opacity="0.85"}} onMouseLeave={e=>e.currentTarget.style.opacity=loading?"0.7":"1"} {...p}>{loading?"…":children}</button>; };
    const Card = ({children,style}) => <div style={{background:"#fff",borderRadius:14,border:`1.5px solid ${C.line}`,padding:28,...style}}>{children}</div>;
    const Tag = ({color=C.teal,children}) => <span style={{display:"inline-block",padding:"3px 10px",borderRadius:20,background:color+"18",color,fontSize:11,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>{children}</span>;
    const Err = ({msg}) => msg ? <div style={{color:C.danger,fontSize:13,marginTop:8,padding:"8px 12px",background:"#fdf0ef",borderRadius:6,border:`1px solid ${C.danger}30`}}>⚠ {msg}</div> : null;
    const Fld = ({error,label,hint,children}) => <div style={{marginBottom:18}}><Lbl c={label}/>{hint&&<div style={{fontSize:12,color:C.muted,marginBottom:6}}>{hint}</div>}{children}{error&&<div style={{color:C.danger,fontSize:12,marginTop:4}}>{error}</div>}</div>;
    const SecTitle = ({color=C.gold,children}) => <div style={{fontSize:13,fontWeight:700,color,marginBottom:18,textTransform:"uppercase",letterSpacing:".08em",paddingBottom:10,borderBottom:`1.5px solid ${C.line}`}}>{children}</div>;
    const DemoBanner = () => <div style={{background:"#fff8e1",border:`1.5px solid ${C.amber}`,borderRadius:10,padding:"12px 18px",marginBottom:24,fontSize:13,color:"#7a5200",display:"flex",gap:10,alignItems:"center"}}><span style={{fontSize:18}}>🔧</span><div><strong>Demo Mode</strong> — data resets on refresh. Add your Supabase credentials to the CONFIG block at the top of this file to go live.</div></div>;

    const RadioGroup = ({name, value, onChange, options}) => (
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        {options.map(([val,label]) => (
          <label key={val} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",padding:"10px 16px",border:`1.5px solid ${value===val?C.teal:C.line}`,borderRadius:8,background:value===val?C.ice:"#fff",fontSize:14,fontWeight:value===val?700:400,color:value===val?C.teal:C.ink,flex:1,justifyContent:"center",transition:"all .15s",minWidth:140}}>
            <input type="radio" name={name} value={val} checked={value===val} onChange={()=>onChange(val)} style={{accentColor:C.teal}}/>
            {label}
          </label>
        ))}
      </div>
    );

    // ── Pipeline ──────────────────────────────────────────────
    function Pipeline({currentStage}) {
      const idx = STAGES.findIndex(s=>s.key===currentStage);
      return (
        <div style={{overflowX:"auto",paddingBottom:8}}>
          <div style={{display:"flex",alignItems:"flex-start",minWidth:560}}>
            {STAGES.map((s,i)=>{
              const done=i<idx,active=i===idx;
              return (
                <div key={s.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",position:"relative"}}>
                  {i>0&&<div style={{position:"absolute",top:15,right:"50%",width:"100%",height:3,background:done||active?C.mint:C.line,zIndex:0}}/>}
                  <div style={{width:30,height:30,borderRadius:"50%",background:active?C.teal:done?C.mint:C.line,display:"flex",alignItems:"center",justifyContent:"center",zIndex:1,border:active?`3px solid ${C.teal}`:"none",boxShadow:active?`0 0 0 4px ${C.teal}25`:"none"}}>
                    {done&&<span style={{color:"#fff",fontSize:13,fontWeight:900}}>✓</span>}
                    {active&&<span style={{width:8,height:8,borderRadius:"50%",background:"#fff",display:"block"}}/>}
                  </div>
                  <div style={{marginTop:7,fontSize:10,fontWeight:active?700:500,color:active?C.ink:done?C.teal:C.muted,textAlign:"center",lineHeight:1.3}}>{s.short}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ── Document Request Presets ──────────────────────────────
    const DOC_REQUEST_PRESETS = [
      "Current Nunavut Business Licence",
      "Proof of Nunavut residency",
      "Supplier quote or cost estimate",
      "Proof of not-for-profit status",
      "CFIA compliance documentation",
      "Detailed project budget breakdown",
      "Letter of support from HTO or community",
      "Signed contribution agreement",
      "Final achievement / activity report",
      "Financial summary with receipts",
      "Shipping address confirmation",
      "Fur Tracking System (FTS) records",
      "Other (specify below)",
    ];

    // ── MessageThread ─────────────────────────────────────────
    function MessageThread({messages, colors, isAdmin, onResolve}) {
      if (!messages || messages.length === 0) return null;
      const sorted = [...messages].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      const CL = colors;
      const statusStyles = {
        pending: {bg:"#FFF3E0",border:"#F5A623",icon:"⏳",label:"Action Required",color:"#B8720A"},
        resolved: {bg:"#E8F5E9",border:"#3BAE8E",icon:"✅",label:"Resolved",color:"#2A7D6B"},
        read: {bg:"#F0F7FF",border:"#B8D4F0",icon:"📨",label:"Sent",color:"#2980B9"},
      };
      return (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {sorted.map(msg => {
            const st = statusStyles[msg.status] || statusStyles.read;
            const isDocReq = msg.type === "doc_request";
            const hasAttachments = msg.attachments && msg.attachments.length > 0;
            const date = new Date(msg.timestamp);
            const dateStr = date.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"});
            const timeStr = date.toLocaleTimeString("en-CA",{hour:"2-digit",minute:"2-digit"});
            return (
              <div key={msg.id} style={{border:`1.5px solid ${st.border}40`,borderRadius:10,overflow:"hidden",background:st.bg}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderBottom:`1px solid ${st.border}30`,flexWrap:"wrap",gap:6}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:14}}>{st.icon}</span>
                    <span style={{fontSize:12,fontWeight:700,color:st.color,textTransform:"uppercase",letterSpacing:".05em"}}>{isDocReq ? "Document Request" : msg.type === "question" ? "Question" : msg.type === "send_document" ? "Document Sent" : "Message"}</span>
                    <span style={{fontSize:11,fontWeight:600,color:CL.muted,padding:"2px 8px",background:"#fff",borderRadius:10,border:`1px solid ${CL.line}`}}>{st.label}</span>
                  </div>
                  <div style={{fontSize:11,color:CL.muted}}>{msg.sender && <strong>{msg.sender}</strong>}{msg.sender && " · "}{dateStr} {timeStr}</div>
                </div>
                <div style={{padding:"12px 14px"}}>
                  <div style={{fontSize:13,color:CL.ink,lineHeight:1.65}}>{msg.text}</div>

                  {/* Requested docs checklist */}
                  {isDocReq && msg.documents && msg.documents.length > 0 && (
                    <div style={{marginTop:12,background:"#fff",borderRadius:8,border:`1px solid ${st.border}30`,padding:"10px 14px"}}>
                      <div style={{fontSize:10,fontWeight:700,color:CL.gold,textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>Documents Requested</div>
                      {msg.documents.map((doc,i) => (
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:i<msg.documents.length-1?`1px solid ${CL.line}`:"none"}}>
                          <span style={{fontSize:14}}>{msg.status==="resolved"?"✅":"📄"}</span>
                          <span style={{fontSize:12,color:CL.ink,fontWeight:500}}>{doc}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Attached files from admin */}
                  {hasAttachments && (
                    <div style={{marginTop:12,background:"#fff",borderRadius:8,border:`1px solid ${CL.teal}30`,padding:"10px 14px"}}>
                      <div style={{fontSize:10,fontWeight:700,color:CL.teal,textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>📎 Attached Files ({msg.attachments.length})</div>
                      {msg.attachments.map((file,i) => {
                        const ext = file.name ? file.name.split(".").pop().toLowerCase() : "";
                        const icon = ext==="pdf"?"📕":["jpg","jpeg","png"].includes(ext)?"🖼️":ext==="xlsx"||ext==="csv"?"📊":"📄";
                        const size = file.size ? (file.size/1024 < 1024 ? (file.size/1024).toFixed(1)+" KB" : (file.size/1024/1024).toFixed(2)+" MB") : "";
                        return (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:i<msg.attachments.length-1?`1px solid ${CL.line}`:"none"}}>
                            <span style={{fontSize:16}}>{icon}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12,color:CL.ink,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{file.name}</div>
                              {size&&<div style={{fontSize:10,color:CL.muted}}>{size}</div>}
                            </div>
                            {!isAdmin && (
                              <div style={{fontSize:11,color:CL.teal,fontWeight:600,whiteSpace:"nowrap"}}>Available</div>
                            )}
                          </div>
                        );
                      })}
                      {!isAdmin && (
                        <div style={{marginTop:8,fontSize:11,color:CL.muted,lineHeight:1.5}}>

    // ── MessageComposer ───────────────────────────────────────
    function MessageComposer({colors, onSend}) {
      const CL = colors;
      const [msgType, setMsgType] = useState("doc_request");
      const [text, setText] = useState("");
      const [selectedDocs, setSelectedDocs] = useState([]);
      const [customDoc, setCustomDoc] = useState("");
      const [expanded, setExpanded] = useState(false);
      const [attachFiles, setAttachFiles] = useState([]);
      const attachRef = useRef(null);

      const toggleDoc = (doc) => {
        setSelectedDocs(prev => prev.includes(doc) ? prev.filter(d => d !== doc) : [...prev, doc]);
      };

      const addCustomDoc = () => {
        if (customDoc.trim() && !selectedDocs.includes(customDoc.trim())) {
          setSelectedDocs(prev => [...prev, customDoc.trim()]);
          setCustomDoc("");
        }
      };

      const removeAttachment = (idx) => {
        setAttachFiles(prev => prev.filter((_,i) => i !== idx));
      };

      const handleFileSelect = (e) => {
        const newFiles = Array.from(e.target.files || []).map(f => ({name:f.name, size:f.size, type:f.type}));
        setAttachFiles(prev => [...prev, ...newFiles]);
        if (attachRef.current) attachRef.current.value = "";
      };

      const handleSend = () => {
        if (!text.trim() && attachFiles.length === 0) return;
        const msg = {
          id: "msg-" + Date.now(),
          type: msgType,
          from: "admin",
          sender: "Admin",
          text: text.trim(),
          documents: msgType === "doc_request" ? selectedDocs : [],
          attachments: attachFiles.length > 0 ? attachFiles : [],
          status: msgType === "send_document" ? "read" : "pending",
          timestamp: new Date().toISOString(),
        };
        onSend(msg);
        setText("");
        setSelectedDocs([]);
        setCustomDoc("");
        setAttachFiles([]);
        setExpanded(false);
      };

        return (
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>

              📄 Request Docs
            </button>
            <button onClick={()=>{setExpanded(true);setMsgType("send_document");}} style={{background:"#E8F5E9",border:`1.5px solid ${CL.mint}40`,borderRadius:8,padding:"10px 14px",cursor:"pointer",fontSize:12,fontWeight:700,color:"#2A7D6B",display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>
              📎 Send Document
            </button>
            <button onClick={()=>{setExpanded(true);setMsgType("question");}} style={{background:"#F0F7FF",border:`1.5px solid #B8D4F0`,borderRadius:8,padding:"10px 14px",cursor:"pointer",fontSize:12,fontWeight:700,color:CL.sky,display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>
              ❓ Ask Question
            </button>
            <button onClick={()=>{setExpanded(true);setMsgType("message");}} style={{background:CL.ice,border:`1.5px solid ${CL.line}`,borderRadius:8,padding:"10px 14px",cursor:"pointer",fontSize:12,fontWeight:700,color:CL.teal,display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>
              💬 Send Note
            </button>
          </div>
        );
      }

      const typeLabels = {doc_request:"Request Documents",send_document:"Send Document",question:"Ask a Question",message:"Send a Note"};
      const typeColors = {doc_request:CL.gold,send_document:"#2A7D6B",question:CL.sky,message:CL.teal};

      return (
        <div style={{border:`1.5px solid ${typeColors[msgType]}40`,borderRadius:10,overflow:"hidden"}}>
          <div style={{background:msgType==="doc_request"?"#FFF8EE":msgType==="send_document"?"#E8F5E9":msgType==="question"?"#F0F7FF":CL.ice,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
              {Object.entries(typeLabels).map(([k,v])=>(
                <button key={k} onClick={()=>setMsgType(k)} style={{padding:"4px 10px",borderRadius:6,border:msgType===k?`1.5px solid ${typeColors[k]}`:`1.5px solid transparent`,background:msgType===k?"#fff":"transparent",fontSize:11,fontWeight:700,color:msgType===k?typeColors[k]:CL.muted,cursor:"pointer"}}>{v}</button>
              ))}
            </div>
            <button onClick={()=>{setExpanded(false);setAttachFiles([]);}} style={{background:"none",border:"none",color:CL.muted,fontSize:18,cursor:"pointer",lineHeight:1}}>×</button>
          </div>

          <div style={{padding:"14px"}}>
            {/* Doc request: checklist */}
            {msgType === "doc_request" && (
              <div style={{marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,color:CL.gold,textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Select Documents to Request</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                  {DOC_REQUEST_PRESETS.filter(d=>d!=="Other (specify below)").map(doc=>(
                    <button key={doc} onClick={()=>toggleDoc(doc)} style={{padding:"5px 12px",borderRadius:6,border:`1.5px solid ${selectedDocs.includes(doc)?CL.gold:CL.line}`,background:selectedDocs.includes(doc)?"#FFF8EE":"#fff",fontSize:11,fontWeight:selectedDocs.includes(doc)?700:500,color:selectedDocs.includes(doc)?CL.gold:CL.muted,cursor:"pointer"}}>{selectedDocs.includes(doc)?"✓ ":""}{doc}</button>
                  ))}
                </div>
                <div style={{display:"flex",gap:6}}>
                  <Inp value={customDoc} onChange={e=>setCustomDoc(e.target.value)} placeholder="Add custom document request…" onKeyDown={e=>e.key==="Enter"&&addCustomDoc()} style={{flex:1,fontSize:12,padding:"7px 10px"}}/>
                  <button onClick={addCustomDoc} style={{padding:"7px 14px",borderRadius:6,border:`1.5px solid ${CL.gold}`,background:"#FFF8EE",color:CL.gold,fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>+ Add</button>
                </div>

            {/* File attachment area — for Send Document and also available on other types */}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:CL.muted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>
                {msgType==="send_document"?"Attach Files to Send to Applicant":"Attach Files (optional)"}
              </div>
              <div style={{border:`1.5px dashed ${attachFiles.length>0?CL.teal:CL.line}`,borderRadius:8,padding:"12px 14px",background:attachFiles.length>0?CL.ice:"#fff"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <button onClick={()=>attachRef.current?.click()} style={{padding:"6px 14px",borderRadius:6,border:`1.5px solid ${CL.teal}`,background:CL.ice,color:CL.teal,fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                    📎 Choose Files
                  </button>
                  <input ref={attachRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.csv,.doc,.docx" multiple onChange={handleFileSelect} style={{display:"none"}}/>
                  <span style={{fontSize:11,color:CL.muted}}>PDF, JPG, PNG, XLSX, DOC — max 10 MB each</span>
                </div>
                {attachFiles.length > 0 && (
                  <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                    {attachFiles.map((file,i) => {
                      const ext = file.name.split(".").pop().toLowerCase();
                      const icon = ext==="pdf"?"📕":["jpg","jpeg","png"].includes(ext)?"🖼️":ext==="xlsx"||ext==="csv"?"📊":"📄";
                      return (
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"#fff",borderRadius:6,border:`1px solid ${CL.line}`}}>
                          <span style={{fontSize:14}}>{icon}</span>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:600,color:CL.ink,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{file.name}</div>
                            <div style={{fontSize:10,color:CL.muted}}>{file.size < 1024*1024 ? (file.size/1024).toFixed(1)+" KB" : (file.size/1024/1024).toFixed(2)+" MB"}</div>
                          </div>
                          <button onClick={()=>removeAttachment(i)} style={{background:"none",border:`1px solid ${CL.line}`,borderRadius:4,color:CL.muted,fontSize:14,cursor:"pointer",padding:"0 6px",lineHeight:"20px"}}>×</button>
                        </div>
                      );
                    })}
                    <div style={{fontSize:11,color:CL.teal,fontWeight:600}}>{attachFiles.length} file{attachFiles.length>1?"s":""} ready to send</div>
                  </div>
                )}
              </div>
              {msgType==="send_document"&&attachFiles.length===0&&(
                <div style={{fontSize:11,color:CL.gold,marginTop:6,fontWeight:600}}>⚠ Please attach at least one file to send.</div>
              )}
            </div>

            {/* Message body */}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:CL.muted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>
                {msgType==="doc_request"?"Explain what is needed and why":msgType==="send_document"?"Message to accompany the document(s)":"Message to applicant"}
              </div>
              <Txta value={text} onChange={e=>setText(e.target.value)} placeholder={msgType==="doc_request"?"e.g. Your business licence on file has expired. Please provide a current copy…":msgType==="send_document"?"e.g. Please find the attached contribution agreement for your review and signature…":msgType==="question"?"e.g. Can you confirm whether CFIA testing includes facility inspection?":"e.g. Your application has been forwarded to the review committee…"} style={{minHeight:70,fontSize:13}}/>
            </div>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:11,color:CL.muted}}>Visible to applicant on status page</div>
              <Btn onClick={handleSend} disabled={msgType==="send_document"&&attachFiles.length===0} style={{background:typeColors[msgType],fontSize:13,padding:"8px 20px",opacity:(msgType==="send_document"&&attachFiles.length===0)?0.5:1}}>
                {msgType==="doc_request"?"📄 Send Request":msgType==="send_document"?"📎 Send Document"+( attachFiles.length>0?" ("+attachFiles.length+")":""):msgType==="question"?"❓ Send Question":"💬 Send Note"}
              </Btn>
            </div>
          </div>
        </div>
      );
    }

    // ── Budget Items (for Contributions & Grants) ─────────────
    function BudgetItems({items,setItems,error}) {
      const add = () => setItems(p=>[...p,{description:"",amount:""}]);
      const remove = (i) => setItems(p=>p.filter((_,x)=>x!==i));
      const update = (i,field,val) => setItems(p=>p.map((r,x)=>x===i?{...r,[field]:val}:r));
      const total = items.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      return (
        <div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 150px 36px",gap:8,marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:".06em",textTransform:"uppercase"}}>Item / Description</div>
            <div style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:".06em",textTransform:"uppercase"}}>Amount (CAD $)</div>
            <div/>
          </div>
          {items.map((row,i)=>(
            <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 150px 36px",gap:8,marginBottom:8}}>

            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
            <button onClick={add} style={{background:"none",border:`1.5px dashed ${C.teal}`,borderRadius:8,color:C.teal,fontSize:13,fontWeight:700,padding:"8px 16px",cursor:"pointer"}}>+ Add Item</button>
            {items.length>0&&<div style={{fontSize:14,fontWeight:700}}>Total: <span style={{color:C.gold}}>${total.toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>}
          </div>
          {error&&<div style={{color:C.danger,fontSize:12,marginTop:6}}>{error}</div>}
        </div>
      );
    }

    // ── Code Generator ────────────────────────────────────────
    function genCode(c) {
      const p=c?c.slice(0,3).toUpperCase().replace(/[^A-Z]/g,"X"):"GEN";
      const n=Math.floor(1000+Math.random()*9000);
      const a=String.fromCharCode(65+Math.floor(Math.random()*26))+String.fromCharCode(65+Math.floor(Math.random()*26));
      return `${p}${String(n)[0]}${a[0]}-${a[1]}${String(n).slice(1)}`;
    }

    // APPLY VIEW
    // ══════════════════════════════════════════════════════════
    function ApplyView({demoApps,setDemoApps}) {
      const [selectedProgram,setSelectedProgram] = useState(null);
      const INIT = {inuit:"",org:"",community:"",contact:"",email:"",phone:"",addr:"",city:"",postal:"",hasLicence:"",licenceNum:"",title:"",desc:"",startDate:"",endDate:"",skinQty:"",skinSize:"",skinType:"",donationImpact:""};
      const [form,setForm] = useState(INIT);
      const [budget,setBudget] = useState([{description:"",amount:""}]);
      const [errors,setErrors] = useState({});
      const [loading,setLoading] = useState(false);
      const [submitted,setSubmitted] = useState(null);
      const [apiErr,setApiErr] = useState("");
      const [supportDocs,setSupportDocs] = useState(null);
      const [proposalFile,setProposalFile] = useState(null);
      const [quoteFile,setQuoteFile] = useState(null);
      const [licenceFile,setLicenceFile] = useState(null);
      const supportDocsRef = useRef(null);
      const proposalRef = useRef(null);
      const quoteRef = useRef(null);
      const licenceRef = useRef(null);
      const f = (k,v) => setForm(p=>({...p,[k]:v}));

      const total = budget.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
      const prog = PROGRAMS.find(p=>p.key===selectedProgram);

      const validate = () => {
        const e={};
        if (!form.inuit) e.inuit="Required";
        if (!form.org.trim()) e.org="Required";
        if (!form.community) e.community="Required";
        if (!form.contact.trim()) e.contact="Required";
        if (!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) e.email="Valid email required";
        if (!form.addr.trim()) e.addr="Required";
        if (!form.city.trim()) e.city="Required";
        if (!form.postal.trim()) e.postal="Required";

        if (selectedProgram === "sealskin_purchase") {
          if (!form.skinQty || parseInt(form.skinQty)<1) e.skinQty="Enter quantity (minimum 1)";
          if (!form.skinSize) e.skinSize="Required";
          if (!form.skinType) e.skinType="Required";
          if (!form.hasLicence) e.hasLicence="Required";
        }
        if (selectedProgram === "donation") {
          if (!form.title.trim()) e.title="Required";
          if (form.desc.trim().length<30) e.desc="Please provide at least 30 characters";
          if (!form.skinQty || parseInt(form.skinQty)<1) e.skinQty="Enter quantity requested";
          if (!form.donationImpact || form.donationImpact.trim().length<20) e.donationImpact="Please describe the expected impact (min 20 characters)";
        }
        if (selectedProgram === "contribution" || selectedProgram === "grant") {
          if (!form.title.trim()) e.title="Required";
          if (form.desc.trim().length<30) e.desc="Please provide at least 30 characters";
          if (!form.startDate) e.startDate="Required";
          if (!form.endDate) e.endDate="Required";
          if (budget.filter(r=>r.description.trim()&&parseFloat(r.amount)>0).length===0) e.budget="Please add at least one budget item";
          if (selectedProgram==="grant" && total>10000) e.budget="Maximum grant amount is $10,000";
          if (selectedProgram==="contribution" && total>150000) e.budget="Maximum contribution amount is $150,000 per fiscal year";
        }
        return e;
      };

      const handleSubmit = async () => {
        const e=validate();
        if (Object.keys(e).length) { setErrors(e); window.scrollTo({top:0,behavior:"smooth"}); return; }
        setLoading(true); setApiErr("");
        const code=genCode(form.community);
        const id=`SFP-${new Date().getFullYear()}-${String(Date.now()).slice(-4)}`;
        const today=new Date().toISOString().split("T")[0];
        const validItems=budget.filter(r=>r.description.trim()&&parseFloat(r.amount)>0);
        try {
          const payload={id,code,program:selectedProgram,is_inuit_beneficiary:form.inuit,org:form.org,community:form.community,contact:form.contact,email:form.email,phone:form.phone,address:`${form.addr}, ${form.city}, ${form.community==="Outside Nunavut"?"":"NU "}${form.postal}`,has_business_licence:form.hasLicence||"no",business_licence_num:form.licenceNum,title:form.title||(prog?.short+" Order"),description:form.desc||form.donationImpact||"",sealskin_quantity:parseInt(form.skinQty)||0,sealskin_sizes:form.skinSize,sealskin_type:form.skinType,amount:selectedProgram==="sealskin_purchase"?0:(selectedProgram==="donation"?0:total),budget_items:selectedProgram==="contribution"||selectedProgram==="grant"?validItems:[],uploaded_docs:[...(supportDocs?Array.from(supportDocs).map(f=>f.name):[]),...(proposalFile?[proposalFile.name]:[]),...(quoteFile?[quoteFile.name]:[]),...(licenceFile?[licenceFile.name]:[])],stage:"received",notes:"",submitted:today,messages:[]};
          if (IS_DEMO) setDemoApps(p=>[...p,payload]);
          else await submitApplication(payload);
          setSubmitted({id,code}); setForm(INIT); setBudget([{description:"",amount:""}]); setSupportDocs(null); setProposalFile(null); setQuoteFile(null); setLicenceFile(null); setErrors({});
          [supportDocsRef,proposalRef,quoteRef,licenceRef].forEach(r=>{if(r.current)r.current.value="";});

        finally { setLoading(false); }
      };

      if (submitted) return (
        <div style={{maxWidth:560,margin:"0 auto"}}>
          <Card style={{textAlign:"center",padding:"48px 36px"}}>
            <div style={{fontSize:52,marginBottom:16}}>🎉</div>
            <div style={{fontSize:22,fontWeight:800,color:C.forest,marginBottom:10}}>Application Submitted!</div>
            <div style={{color:C.muted,marginBottom:28,lineHeight:1.6}}>Your Seal & Fur Programs application has been received. Save your access code — you will need it to check your status.</div>
            <div style={{background:C.ice,borderRadius:12,padding:"20px 28px",marginBottom:28,border:`2px dashed ${C.teal}`}}>
              <Lbl c="Your Secure Access Code"/>
              <div style={{fontSize:34,fontWeight:900,color:C.forest,letterSpacing:"0.12em",fontFamily:"monospace"}}>{submitted.code}</div>
              <div style={{fontSize:12,color:C.muted,marginTop:6}}>{submitted.id}</div>
            </div>
            <div style={{fontSize:13,color:C.muted,marginBottom:24,background:C.snow,borderRadius:8,padding:14,textAlign:"left",lineHeight:1.7}}>
              🔒 <strong>Your personal information is protected</strong> under the <em>Access to Information and Protection of Privacy Act</em> (ATIPPA).<br/><br/>
              ⏱ Initial eligibility review completed within <strong>15 business days</strong>.
            </div>
            <Btn onClick={()=>{setSubmitted(null);setSelectedProgram(null);}}>Submit Another Application</Btn>
          </Card>
        </div>
      );

      // Program selector
      if (!selectedProgram) return (
        <div style={{maxWidth:780,margin:"0 auto"}}>
          {IS_DEMO&&<DemoBanner/>}

            <div style={{fontSize:22,fontWeight:800,color:C.forest}}>Apply for a Seal & Fur Program</div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            {PROGRAMS.map(prog=>(
              <div key={prog.key} onClick={()=>setSelectedProgram(prog.key)} style={{background:"#fff",borderRadius:14,border:`1.5px solid ${C.line}`,padding:"24px 22px",cursor:"pointer",transition:"all .15s",display:"flex",flexDirection:"column",gap:8}} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.teal;e.currentTarget.style.boxShadow=`0 4px 20px ${C.teal}15`;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.line;e.currentTarget.style.boxShadow="none";}}>

            <button onClick={()=>{setSelectedProgram(null);setErrors({});}} style={{background:"none",border:"none",color:C.teal,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:10,padding:0}}>← Back to Program Selection</button>

              <div style={{fontSize:32}}>{prog.icon}</div>
              <div>

              <Fld label="Phone Number" error={errors.phone}><Inp value={form.phone} onChange={e=>f("phone",e.target.value)} placeholder="867-XXX-XXXX"/></Fld>

              {selectedProgram==="grant"&&"Please attach a detailed project proposal and any supporting documents such as supplier quotes, letters of support from HTOs or community councils, or evidence of past project success."}
              <br/><br/>Accepted formats: <strong>PDF, JPG, or PNG</strong> — max 10 MB per file.
            </div>

            {/* Proposal / Plan — for donations, contributions, grants */}
            {(selectedProgram==="donation"||selectedProgram==="contribution"||selectedProgram==="grant")&&(
              <Fld label="Detailed Proposal or Project Plan" hint="A written document describing your project objectives, activities, expected outcomes, and timeline.">
                <input ref={proposalRef} type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setProposalFile(e.target.files[0]||null)}/>
                {proposalFile&&<div style={{marginTop:6,fontSize:12,color:C.teal,fontWeight:600}}>📎 {proposalFile.name} ({(proposalFile.size/1024/1024).toFixed(2)} MB)</div>}
                {IS_DEMO&&proposalFile&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>Demo mode: file selected but not uploaded to server.</div>}
              </Fld>
            )}

            {/* Supplier quotes — for contributions, grants, sealskin_purchase */}
            {(selectedProgram==="contribution"||selectedProgram==="grant")&&(
              <Fld label="Supplier Quote or Cost Estimate (if available)" hint="Quotes help speed up the budget assessment. Not required to submit.">
                <input ref={quoteRef} type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setQuoteFile(e.target.files[0]||null)}/>
                {quoteFile&&<div style={{marginTop:6,fontSize:12,color:C.teal,fontWeight:600}}>📎 {quoteFile.name} ({(quoteFile.size/1024/1024).toFixed(2)} MB)</div>}
              </Fld>

            {/* Business Licence — for sealskin purchases */}
            {selectedProgram==="sealskin_purchase"&&form.hasLicence==="yes"&&(
              <Fld label="Copy of Nunavut Business Licence" hint="Attach a copy of your current valid business licence to enable invoicing with 30-day payment terms.">
                <input ref={licenceRef} type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setLicenceFile(e.target.files[0]||null)}/>
                {licenceFile&&<div style={{marginTop:6,fontSize:12,color:C.teal,fontWeight:600}}>📎 {licenceFile.name} ({(licenceFile.size/1024/1024).toFixed(2)} MB)</div>}
              </Fld>
            )}

            {/* General supporting docs — all programs */}
            <Fld label="Additional Supporting Documents (optional)" hint={selectedProgram==="donation"?"e.g. Letter of support, proof of not-for-profit status, exhibition prospectus.":selectedProgram==="sealskin_purchase"?"e.g. Organization letter confirming the order, previous order history.":"e.g. Letters of support from HTOs or community councils, previous project reports, proof of other funding."}>
              <input ref={supportDocsRef} type="file" accept=".pdf,.jpg,.jpeg,.png" multiple onChange={e=>setSupportDocs(e.target.files)}/>
              {supportDocs&&supportDocs.length>0&&<div style={{marginTop:6,fontSize:12,color:C.teal,fontWeight:600}}>📎 {supportDocs.length} file{supportDocs.length>1?"s":""} selected{supportDocs.length>0&&" — "+Array.from(supportDocs).map(f=>f.name).join(", ")}</div>}
              {IS_DEMO&&supportDocs&&supportDocs.length>0&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>Demo mode: files selected but not uploaded to server.</div>}
            </Fld>
          </Card>

          {/* Declaration & Submit */}
          <Card style={{marginBottom:28,background:C.ice}}>
            <div style={{fontSize:13,color:C.muted,lineHeight:1.8}}>
              🔒 <strong>Privacy Notice:</strong> Personal information collected on this form is used solely for administering the Seal and Fur Programs and is protected under the <em>Access to Information and Protection of Privacy Act</em> (ATIPPA). Your information will only be accessible to authorized Department of Economic Development and Transportation staff.<br/><br/>
              📜 By submitting, I confirm that the information provided is accurate and complete, and I understand that:
              <div style={{marginTop:8,paddingLeft:16}}>
                • Eligibility does not guarantee approval for funding or sealskins.<br/>
                • The Government of Nunavut retains the right to audit activities supported under this program.<br/>
                • The Government of Nunavut may use project details for communications, reporting, and marketing purposes.<br/>
                {selectedProgram==="contribution"&&"• A signed Contribution Agreement is required before payment is issued.\n"}
                {selectedProgram==="grant"&&"• A final achievement report must be submitted within 90 days of project completion.\n"}
                {selectedProgram==="contribution"&&"• A final project activity report and financial summary are due within 60 days of project completion.\n"}
              </div>
            </div>
          </Card>

          <div style={{display:"flex",justifyContent:"flex-end",gap:12}}>
            <Btn variant="ghost" onClick={()=>{setSelectedProgram(null);setErrors({});}}>Cancel</Btn>
            <Btn onClick={handleSubmit} loading={loading}>Submit Application</Btn>
          </div>
        </div>
      );
    }

    // STATUS VIEW
    // ══════════════════════════════════════════════════════════
    function StatusView({demoApps}) {
      const [code,setCode]=useState(""); const [loading,setLoading]=useState(false); const [result,setResult]=useState(null); const [err,setErr]=useState("");
      const lookup = async () => {
        const q=code.trim().toUpperCase();
        if(q.length<6){setErr("Please enter a valid access code.");return;}
        setLoading(true);setErr("");setResult(null);
        try {
          let r;
          if(IS_DEMO) r=demoApps.find(a=>a.code===q)||null;
          else r=await lookupStatus(q);
          if(!r)setErr("No application found with that access code. Please double-check and try again.");
          else setResult(r);
        } catch(e){setErr(e.message);}
        finally{setLoading(false);}
      };

      const prog = result ? PROGRAMS.find(p=>p.key===result.program) : null;
      const idx = result ? STAGES.findIndex(s=>s.key===result.stage) : 0;
      const pct = result ? Math.round(((idx+1)/STAGES.length)*100) : 0;

      return (
        <div style={{maxWidth:620,margin:"0 auto"}}>
          {IS_DEMO&&<DemoBanner/>}
          <Card style={{padding:"36px 32px"}}>
            <div style={{textAlign:"center",marginBottom:28}}>
              <div style={{fontSize:36,marginBottom:10}}>🔍</div>
              <div style={{fontSize:20,fontWeight:800,color:C.forest}}>Check Application Status</div>
              <div style={{color:C.muted,fontSize:13,marginTop:6}}>Enter the access code you received when you submitted your application.</div>
              {IS_DEMO&&<div style={{background:C.ice,borderRadius:8,padding:"10px 14px",fontSize:12,color:C.muted,marginTop:12}}>Demo codes: <strong style={{fontFamily:"monospace",letterSpacing:".05em"}}>IQA3-SKLM</strong>, <strong style={{fontFamily:"monospace",letterSpacing:".05em"}}>RAN5-FGRT</strong>, <strong style={{fontFamily:"monospace",letterSpacing:".05em"}}>PAN8-DKWN</strong>, <strong style={{fontFamily:"monospace",letterSpacing:".05em"}}>CAM2-HJNP</strong></div>}
            </div>
            <div style={{display:"flex",gap:10}}>
              <Inp value={code} onChange={e=>setCode(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&lookup()} placeholder="e.g. IQA3-SKLM" style={{fontFamily:"monospace",fontSize:18,letterSpacing:".06em",textAlign:"center",flex:1}}/>
              <Btn onClick={lookup} loading={loading}>Look Up</Btn>
            </div>
            <Err msg={err}/>
          </Card>

          {result&&(
            <div>
              {/* Action Required Banner */}
              {(()=>{const pendingMsgs=(result.messages||[]).filter(m=>m.status==="pending"); return pendingMsgs.length>0?(
                <div style={{background:"#FDF0EF",border:`1.5px solid ${C.danger}`,borderRadius:10,padding:"16px 20px",marginTop:20,marginBottom:0,display:"flex",gap:12,alignItems:"flex-start"}}>
                  <span style={{fontSize:18}}>⚠️</span>
                  <div>
                    <div style={{fontSize:15,fontWeight:800,color:"#C0392B"}}>Action Required</div>
                    <div style={{fontSize:13,color:"#8B2020",lineHeight:1.6}}>
                      The Fisheries &amp; Sealing Division has sent you <strong>{pendingMsgs.length} {pendingMsgs.length===1?"request":"requests"}</strong> that require your response. Please review the messages below and provide the requested information or documents to avoid delays in processing your application.
                    </div>
                  </div>
                </div>
              ):null;})()}

              <Card style={{marginTop:20,padding:"28px 32px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:17,fontWeight:800,color:C.ink}}>{result.title || (prog?.short+" — "+result.org)}</div>
                    <div style={{fontSize:12,color:C.muted,marginTop:2}}>{result.org} · {result.community}</div>
                    <div style={{fontSize:11,color:C.muted,fontFamily:"monospace",marginTop:2}}>{result.id}</div>
                  </div>
                  {prog&&<Tag color={C.teal}>{prog.icon} {prog.short}</Tag>}
                </div>

                <div style={{marginBottom:22}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><Lbl c="Progress"/><span style={{fontSize:12,color:C.muted}}>{pct}% complete</span></div><div style={{height:7,background:C.line,borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${C.teal},${C.mint})`,borderRadius:4}}/></div></div>
                <Pipeline currentStage={result.stage}/>
                <div style={{borderTop:`1.5px solid ${C.line}`,marginTop:24,paddingTop:20}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                    {[["Submitted",result.submitted],["Program",prog?.label||result.program]].map(([k,v])=><div key={k}><Lbl c={k}/><div style={{fontSize:13,color:C.ink,fontWeight:600}}>{v}</div></div>)}
                    {result.amount>0&&<div><Lbl c="Amount Requested"/><div style={{fontSize:13,color:C.gold,fontWeight:700}}>${Number(result.amount).toLocaleString()}</div></div>}
                    {result.sealskin_quantity>0&&<div><Lbl c="Sealskins Requested"/><div style={{fontSize:13,color:C.ink,fontWeight:600}}>{result.sealskin_quantity} ({result.sealskin_sizes})</div></div>}
                  </div>
                  {result.notes&&<div style={{marginTop:16,background:C.ice,borderRadius:8,padding:"12px 14px",fontSize:13,color:C.muted,borderLeft:`3px solid ${C.teal}`}}><strong>Program Note:</strong> {result.notes}</div>}
                </div>
              </Card>

              {/* Messages from Division */}
              {result.messages&&result.messages.length>0&&(
                <Card style={{marginTop:20}}>
                  <div style={{fontSize:14,fontWeight:800,color:C.forest,marginBottom:4}}>Messages from the Division</div>
                  <div style={{fontSize:12,color:C.muted,marginBottom:14,lineHeight:1.5}}>These messages are from the Fisheries &amp; Sealing Division reviewing your application. If action is required, please email the requested documents or information to <strong>sealandfur@gov.nu.ca</strong> with your application code in the subject line.</div>
                  <MessageThread messages={result.messages} colors={C} isAdmin={false}/>
                </Card>
              )}
            </div>
          )}
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════
    // ADMIN VIEW
    // ══════════════════════════════════════════════════════════
    function AdminView({demoApps,setDemoApps}) {
      const [session,setSession]=useState(null); const [email,setEmail]=useState(""); const [password,setPassword]=useState(""); const [loginErr,setLoginErr]=useState(""); const [loginLoading,setLoginLoading]=useState(false);
      const [apps,setApps]=useState([]); const [appsLoading,setAppsLoading]=useState(false); const [search,setSearch]=useState(""); const [filterStage,setFilterStage]=useState(""); const [filterProgram,setFilterProgram]=useState("");
      const [selected,setSelected]=useState(null); const [newStage,setNewStage]=useState(""); const [note,setNote]=useState(""); const [saving,setSaving]=useState(false); const [saved,setSaved]=useState(false); const [saveErr,setSaveErr]=useState("");

      const loadApps = useCallback(async (token) => { setAppsLoading(true); try { if(IS_DEMO)setApps(demoApps); else {const d=await fetchAllApps(token);setApps(d||[]);} } catch(e){console.error(e);} finally{setAppsLoading(false);} },[demoApps]);
      React.useEffect(()=>{if(session?.isDemoSession)setApps(demoApps);},[demoApps,session]);

      const handleLogin = async () => { setLoginLoading(true);setLoginErr(""); try { if(IS_DEMO){setSession({isDemoSession:true,user:{email:"demo@gov.nu.ca"}});setApps(demoApps);}else{const s=await adminSignIn(email,password);setSession(s);await loadApps(s.access_token);} } catch(e){setLoginErr(e.message);} finally{setLoginLoading(false);} };
      const handleLogout = async () => { if(!IS_DEMO&&session?.access_token)await adminSignOut(session.access_token); setSession(null);setApps([]);setSelected(null); };
      const openApp = (app) => { setSelected(app);setNewStage(app.stage);setNote(app.notes||"");setSaved(false);setSaveErr(""); };
      const saveUpdate = async () => { if(!selected)return; setSaving(true);setSaveErr("");setSaved(false); try { const patch={stage:newStage,notes:note}; if(IS_DEMO){setDemoApps(p=>p.map(a=>a.id===selected.id?{...a,...patch}:a));setApps(p=>p.map(a=>a.id===selected.id?{...a,...patch}:a));}else{await updateApp(selected.id,patch,session.access_token);setApps(p=>p.map(a=>a.id===selected.id?{...a,...patch}:a));} setSelected(p=>({...p,...patch}));setSaved(true);setTimeout(()=>setSaved(false),3000); } catch(e){setSaveErr(e.message);} finally{setSaving(false);} };

      const parseBudget = (app) => { if(!app.budget_items)return[]; if(Array.isArray(app.budget_items))return app.budget_items; try{return JSON.parse(app.budget_items);}catch{return[];} };

      if (!session) return (
        <div style={{maxWidth:420,margin:"60px auto"}}>
          {IS_DEMO&&<DemoBanner/>}
          <Card style={{padding:"40px 36px"}}>
            <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:36,marginBottom:12}}>🔐</div><div style={{fontSize:20,fontWeight:800,color:C.forest}}>Admin Access</div><div style={{color:C.muted,fontSize:13,marginTop:6}}>Department of Economic Development & Transportation — Fisheries & Sealing Division</div></div>
            {IS_DEMO?<div style={{background:C.ice,borderRadius:8,padding:16,fontSize:13,color:C.muted,marginBottom:20,textAlign:"center"}}>Demo mode — click Sign In to access the admin panel.</div>:<><Fld label="GN Email"><Inp type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="you@gov.nu.ca"/></Fld><Fld label="Password"><Inp type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} placeholder="••••••••"/></Fld></>}
            <Err msg={loginErr}/><Btn onClick={handleLogin} loading={loginLoading} style={{width:"100%",marginTop:8}}>Sign In</Btn>
            {!IS_DEMO&&<div style={{fontSize:12,color:C.muted,marginTop:16,textAlign:"center"}}>Contact your system administrator if you need access.</div>}
          </Card>
        </div>
      );

      const filtered=apps.filter(a=>{const q=search.toLowerCase();const mQ=!q||[a.org,a.title,a.community,a.code,a.contact].some(f=>f?.toLowerCase().includes(q));return mQ&&(!filterStage||a.stage===filterStage)&&(!filterProgram||a.program===filterProgram);});
      const totalFunding=apps.filter(a=>a.program==="contribution"||a.program==="grant").reduce((s,a)=>s+Number(a.amount||0),0);
      const totalSkins=apps.filter(a=>a.program==="sealskin_purchase"||a.program==="donation").reduce((s,a)=>s+Number(a.sealskin_quantity||0),0);
      const byStage=k=>apps.filter(a=>a.stage===k).length;

      return (
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,flexWrap:"wrap",gap:12}}>
            <div><div style={{fontSize:22,fontWeight:800,color:C.forest}}>Admin Dashboard</div><div style={{fontSize:13,color:C.muted}}>Signed in as {session.user?.email}</div></div>
            <Btn variant="ghost" onClick={handleLogout} style={{fontSize:12}}>Sign Out</Btn>
          </div>
          {IS_DEMO&&<DemoBanner/>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:14,marginBottom:24}}>
            {[["Total Applications",apps.length,C.ink],["Pending Review",byStage("received")+byStage("eligibility"),C.sky],["Doc Requests Out",apps.reduce((s,a)=>s+(a.messages||[]).filter(m=>m.status==="pending").length,0),C.danger],["Funding Requested","$"+(totalFunding/1000).toFixed(0)+"K",C.gold],["Sealskins Requested",totalSkins,C.teal]].map(([label,val,col])=>(
              <Card key={label} style={{textAlign:"center",padding:"16px 12px"}}><div style={{fontSize:26,fontWeight:900,color:col}}>{val}</div><div style={{fontSize:11,color:C.muted,marginTop:4,fontWeight:600,letterSpacing:".05em",textTransform:"uppercase"}}>{label}</div></Card>
            ))}
          </div>

          <div style={{display:"grid",gridTemplateColumns:selected?"1fr 410px":"1fr",gap:20,alignItems:"start"}}>
            <div>
              <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                <Inp value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search org, title, community, code…" style={{flex:1,minWidth:200}}/>
                <Sel value={filterProgram} onChange={e=>setFilterProgram(e.target.value)} style={{width:"auto",minWidth:160}}>
                  <option value="">All Programs</option>{PROGRAMS.map(p=><option key={p.key} value={p.key}>{p.short}</option>)}
                </Sel>
                <Sel value={filterStage} onChange={e=>setFilterStage(e.target.value)} style={{width:"auto",minWidth:145}}>
                  <option value="">All Stages</option>{STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
                </Sel>
              </div>
              {appsLoading&&<div style={{color:C.muted,padding:"20px 0",textAlign:"center"}}>Loading applications…</div>}
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {!appsLoading&&filtered.length===0&&<div style={{color:C.muted,fontSize:14,padding:"20px 0",textAlign:"center"}}>No applications match your filters.</div>}
                {filtered.map(app=>{
                  const appProg=PROGRAMS.find(p=>p.key===app.program);
                  return (
                    <div key={app.id} onClick={()=>openApp(app)} style={{background:selected?.id===app.id?C.ice:"#fff",border:`1.5px solid ${selected?.id===app.id?C.teal:C.line}`,borderRadius:10,padding:"14px 18px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,color:C.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{app.title||appProg?.short}</div>
                        <div style={{fontSize:12,color:C.muted,marginTop:2}}>{app.org} · {app.community} {app.is_inuit_beneficiary==="yes"&&<span style={{marginLeft:6,background:C.teal+"18",color:C.teal,fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:10}}>Inuit Beneficiary</span>}</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:2,fontFamily:"monospace"}}>{app.id} · {app.code}</div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <Tag color={STAGE_COLORS[app.stage]}>{STAGES.find(s=>s.key===app.stage)?.short}</Tag>
                        </div>
                        <div style={{fontSize:11,color:C.muted,fontWeight:600}}>{appProg?.icon} {appProg?.short}</div>
                        {app.amount>0&&<div style={{fontSize:12,fontWeight:700,color:C.gold}}>${Number(app.amount).toLocaleString()}</div>}
                        {app.sealskin_quantity>0&&app.amount===0&&<div style={{fontSize:12,fontWeight:600,color:C.teal}}>{app.sealskin_quantity} skins</div>}
                        {(app.messages||[]).filter(m=>m.status==="pending").length>0&&<span style={{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,background:"#FDF0EF",color:C.danger,border:`1px solid ${C.danger}30`}}>📄 {(app.messages||[]).filter(m=>m.status==="pending").length} pending</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {selected&&(
              <Card style={{position:"sticky",top:20,padding:22,maxHeight:"90vh",overflowY:"auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18}}>
                  <div><div style={{fontSize:15,fontWeight:800,color:C.ink,lineHeight:1.3}}>{selected.title||PROGRAMS.find(p=>p.key===selected.program)?.short}</div><div style={{fontSize:12,color:C.muted,marginTop:2,fontFamily:"monospace"}}>{selected.id}</div></div>
                  <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:C.muted,fontSize:22,cursor:"pointer",lineHeight:1}}>×</button>
                </div>

                <div style={{marginBottom:14}}><Lbl c="Program"/><Tag color={C.teal}>{PROGRAMS.find(p=>p.key===selected.program)?.icon} {PROGRAMS.find(p=>p.key===selected.program)?.label}</Tag></div>
                <div style={{marginBottom:14}}><Lbl c="Inuit Beneficiary"/><Tag color={selected.is_inuit_beneficiary==="yes"?C.teal:C.muted}>{selected.is_inuit_beneficiary==="yes"?"Yes — Inuit Beneficiary":selected.is_inuit_beneficiary==="org"?"Organization":"No"}</Tag></div>

                {[["Organization",selected.org],["Community",selected.community],["Contact",selected.contact],["Email",selected.email],["Phone",selected.phone||"—"],["Address",selected.address||"—"],["Submitted",selected.submitted]].map(([k,v])=>(
                  <div key={k} style={{marginBottom:10}}><Lbl c={k}/><div style={{fontSize:13,color:C.ink,wordBreak:"break-word"}}>{v}</div></div>
                ))}

                {selected.sealskin_quantity>0&&(
                  <div style={{marginBottom:10}}>
                    <Lbl c="Sealskin Details"/>
                    <div style={{fontSize:13,color:C.ink}}>Qty: <strong>{selected.sealskin_quantity}</strong> · Size: {selected.sealskin_sizes||"—"} · Type: {selected.sealskin_type||"—"}</div>
                  </div>
                )}

                {selected.amount>0&&<div style={{marginBottom:10}}><Lbl c="Amount Requested"/><div style={{fontSize:15,fontWeight:800,color:C.gold}}>${Number(selected.amount).toLocaleString()}</div></div>}

                {parseBudget(selected).length>0&&(
                  <div style={{marginBottom:14}}>
                    <Lbl c="Budget Breakdown"/>
                    <div style={{border:`1px solid ${C.line}`,borderRadius:8,overflow:"hidden"}}>
                      {parseBudget(selected).map((item,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:i%2===0?"#fff":C.snow,fontSize:12}}>
                          <span style={{color:C.ink}}>{item.description}</span>
                          <span style={{color:C.gold,fontWeight:700,marginLeft:12,whiteSpace:"nowrap"}}>${Number(item.amount).toLocaleString()}</span>
                        </div>
                      ))}
                      <div style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",background:C.ice,fontSize:12,fontWeight:700,borderTop:`1px solid ${C.line}`}}>
                        <span>Total</span><span style={{color:C.gold}}>${Number(selected.amount||0).toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                )}

                {(selected.has_business_licence==="yes")&&<div style={{marginBottom:10}}><Lbl c="Business Licence"/><div style={{fontSize:13,color:C.teal,fontWeight:600}}>✓ {selected.business_licence_num||"On file"}</div></div>}

                <div style={{marginBottom:14}}><Lbl c="Description"/><div style={{fontSize:12,color:C.muted,lineHeight:1.6,maxHeight:120,overflow:"auto"}}>{selected.description||"—"}</div></div>

                {/* Uploaded Documents */}
                {selected.uploaded_docs&&selected.uploaded_docs.length>0&&(
                  <div style={{marginBottom:14}}>
                    <Lbl c="Uploaded Documents"/>
                    <div style={{border:`1px solid ${C.line}`,borderRadius:8,overflow:"hidden"}}>
                      {selected.uploaded_docs.map((doc,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",background:i%2===0?"#fff":C.snow,fontSize:12}}>
                          <span style={{fontSize:14}}>📎</span>
                          <span style={{color:C.ink,fontWeight:500}}>{doc}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {(!selected.uploaded_docs||selected.uploaded_docs.length===0)&&(
                  <div style={{marginBottom:14}}><Lbl c="Uploaded Documents"/><div style={{fontSize:12,color:C.muted,fontStyle:"italic"}}>No documents uploaded with application</div></div>
                )}

                <div style={{borderTop:`1.5px solid ${C.line}`,paddingTop:16,marginTop:4}}>
                  <Fld label="Update Stage"><Sel value={newStage} onChange={e=>setNewStage(e.target.value)}>{STAGES.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</Sel></Fld>
                  <Fld label="Program Note (visible to applicant)"><Txta value={note} onChange={e=>setNote(e.target.value)} placeholder="Optional note…" style={{minHeight:70}}/></Fld>
                  <Err msg={saveErr}/>
                  <Btn onClick={saveUpdate} loading={saving} style={{width:"100%",marginTop:saveErr?8:0}}>{saved?"✓ Saved!":"Save Update"}</Btn>
                </div>

                {/* ── Messages & Document Requests ── */}
                <div style={{borderTop:`1.5px solid ${C.line}`,paddingTop:16,marginTop:16}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.gold,textTransform:"uppercase",letterSpacing:".08em",marginBottom:12}}>Messages &amp; Document Requests</div>
                  <div style={{marginBottom:14}}>
                    <MessageComposer colors={C} onSend={(msg)=>{
                      const updated={...selected,messages:[...(selected.messages||[]),msg]};
                      if(IS_DEMO){setDemoApps(p=>p.map(a=>a.id===selected.id?updated:a));setApps(p=>p.map(a=>a.id===selected.id?updated:a));}
                      setSelected(updated);
                    }}/>
                  </div>
                  {(selected.messages&&selected.messages.length>0)&&(
                    <div>
                      <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>Message History ({selected.messages.length})</div>
                      <MessageThread messages={selected.messages} colors={C} isAdmin={true} onResolve={(msgId)=>{
                        const updatedMsgs = (selected.messages||[]).map(m=>m.id===msgId?{...m,status:"resolved"}:m);
                        const updated = {...selected, messages:updatedMsgs};
                        if(IS_DEMO){setDemoApps(p=>p.map(a=>a.id===selected.id?{...a,messages:updatedMsgs}:a));setApps(p=>p.map(a=>a.id===selected.id?{...a,messages:updatedMsgs}:a));}
                        setSelected(updated);
                      }}/>
                    </div>
                  )}
                </div>
              </Card>
            )}
          </div>
        </div>
      );
    }

    // ── Root ──────────────────────────────────────────────────
    function SealFurPortal() {
      const [tab,setTab]=useState("apply");
      const [demoApps,setDemoApps]=useState(DEMO_APPS);
      const NAV=[{key:"apply",label:"Apply",icon:"📋"},{key:"status",label:"Check Status",icon:"🔍"},{key:"admin",label:"Admin",icon:"⚙️"}];
      return (
        <div style={{minHeight:"100vh",background:C.snow,color:C.ink}}>
          <div style={{background:C.forest,color:"#fff"}}>
            <div style={{maxWidth:1100,margin:"0 auto",padding:"0 24px"}}>
              <div style={{padding:"18px 0 0",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
                <div style={{background:C.gold,borderRadius:8,padding:"6px 10px",fontSize:18}}>🦭</div>
                <div>
                  <div style={{fontSize:13,letterSpacing:".12em",textTransform:"uppercase",color:"rgba(255,255,255,.55)",fontWeight:600}}>Government of Nunavut · Economic Development &amp; Transportation</div>
                  <div style={{fontSize:19,fontWeight:800,fontFamily:"'Lora',serif"}}>Seal and Fur Programs</div>
                </div>
              </div>
              <div style={{display:"flex",gap:4,marginTop:16}}>
                {NAV.map(n=><button key={n.key} onClick={()=>setTab(n.key)} style={{background:tab===n.key?"rgba(255,255,255,.12)":"transparent",border:"none",borderBottom:tab===n.key?`3px solid ${C.amber}`:"3px solid transparent",color:tab===n.key?"#fff":"rgba(255,255,255,.6)",padding:"10px 20px",fontSize:13,fontWeight:700,cursor:"pointer",letterSpacing:".04em"}}>{n.icon} {n.label}</button>)}
              </div>
            </div>
          </div>

          <div style={{maxWidth:1100,margin:"0 auto",padding:"36px 24px 60px"}}>
            {tab==="apply"  &&<ApplyView  demoApps={demoApps} setDemoApps={setDemoApps}/>}
            {tab==="status" &&<StatusView demoApps={demoApps}/>}
            {tab==="admin"  &&<AdminView  demoApps={demoApps} setDemoApps={setDemoApps}/>}
          </div>

          <div style={{borderTop:`1.5px solid ${C.line}`,padding:"28px 24px",textAlign:"center",background:"#fff"}}>
            <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Fisheries &amp; Sealing Division · Department of Economic Development &amp; Transportation · Government of Nunavut</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:8}}>Questions or concerns? Please contact us <strong>before submitting</strong>.</div>
            <a href="mailto:sealandfur@gov.nu.ca" style={{color:C.teal,fontSize:15,fontWeight:700,textDecoration:"none",letterSpacing:".02em"}}>✉ sealandfur@gov.nu.ca</a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SealFurPortal/>);
  </script>
</body>
</html>
